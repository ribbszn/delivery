<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIBBS ZN — KDS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fire: #ff4d00;
        --fire-dim: #cc3d00;
        --gold: #ffb800;
        --bg: #0a0a0a;
        --surface: #111111;
        --surface2: #1a1a1a;
        --surface3: #222222;
        --border: #2a2a2a;
        --text: #f0f0f0;
        --text-dim: #888;
        --text-muted: #555;
        --green: #00c853;
        --red: #ff1744;
        --blue: #2979ff;
        --amber: #ffb800;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ══════════════════════════════════════════
     LOGIN SCREEN
  ══════════════════════════════════════════ */
      #login-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }
      .login-logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 4rem;
        color: var(--fire);
        letter-spacing: 4px;
      }
      .login-logo span {
        color: var(--text-dim);
        font-size: 1.2rem;
        display: block;
        font-family: "DM Sans", sans-serif;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-top: -12px;
      }
      .login-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem;
        width: 340px;
      }
      .login-box h3 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.4rem;
        letter-spacing: 2px;
        color: var(--text-dim);
        margin-bottom: 1.5rem;
        text-align: center;
      }
      .pin-display {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 2rem;
      }
      .pin-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: transparent;
        transition: all 0.2s;
      }
      .pin-dot.filled {
        background: var(--fire);
        border-color: var(--fire);
      }
      .pin-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .pin-btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.8rem;
        letter-spacing: 2px;
        padding: 14px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .pin-btn:hover {
        background: var(--surface3);
        border-color: var(--fire);
      }
      .pin-btn:active {
        transform: scale(0.95);
      }
      .pin-btn.clear {
        font-family: "DM Sans", sans-serif;
        font-size: 0.85rem;
        letter-spacing: 1px;
        color: var(--text-dim);
      }
      .pin-error {
        color: var(--red);
        text-align: center;
        font-size: 0.85rem;
        margin-top: 1rem;
        min-height: 1.2em;
      }

      /* ══════════════════════════════════════════
     HEADER
  ══════════════════════════════════════════ */
      .kds-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        height: 60px;
        gap: 1rem;
      }
      .header-brand {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.6rem;
        color: var(--fire);
        letter-spacing: 3px;
      }
      .header-nav {
        display: flex;
        gap: 6px;
      }
      .nav-btn {
        padding: 7px 16px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-dim);
        transition: all 0.2s;
        text-transform: uppercase;
      }
      .nav-btn.active {
        background: var(--fire);
        border-color: var(--fire);
        color: #fff;
      }
      .nav-btn:hover:not(.active) {
        border-color: var(--fire);
        color: var(--text);
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .store-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface2);
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .store-toggle .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--red);
        transition: background 0.3s;
      }
      .store-toggle.open .dot {
        background: var(--green);
      }
      .store-toggle.open {
        border-color: var(--green);
        color: var(--green);
      }
      .store-toggle:not(.open) {
        border-color: var(--red);
        color: var(--red);
      }
      .btn-logout {
        padding: 7px 14px;
        border-radius: 8px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        transition: all 0.2s;
      }
      .btn-logout:hover {
        border-color: var(--red);
        color: var(--red);
      }

      /* ══════════════════════════════════════════
     MAIN LAYOUT
  ══════════════════════════════════════════ */
      .kds-main {
        display: none;
        padding: 1.5rem;
        gap: 1.5rem;
        min-height: calc(100vh - 60px);
      }

      /* ══════════════════════════════════════════
     ORDERS VIEW
  ══════════════════════════════════════════ */
      #view-orders {
        display: none;
        flex-direction: column;
        gap: 1.5rem;
        width: 100%;
      }
      #view-orders.active {
        display: flex;
      }
      .orders-columns {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
      }
      .orders-col {
        background: var(--surface);
        border-radius: 14px;
        border: 1px solid var(--border);
        padding: 1rem;
        min-height: 300px;
      }
      .col-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .col-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.2rem;
        letter-spacing: 2px;
      }
      .col-count {
        background: var(--surface3);
        color: var(--text-dim);
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 3px 10px;
      }
      .col-title.pending {
        color: var(--amber);
      }
      .col-title.making {
        color: var(--blue);
      }
      .col-title.ready {
        color: var(--green);
      }

      /* ORDER CARD */
      .order-card {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 0.75rem;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
      }
      .order-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
      }
      .order-card.pending::before {
        background: var(--amber);
      }
      .order-card.making::before {
        background: var(--blue);
      }
      .order-card.ready::before {
        background: var(--green);
      }
      .order-card:hover {
        border-color: var(--fire);
        transform: translateY(-1px);
      }
      .order-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .order-id {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.1rem;
        color: var(--fire);
        letter-spacing: 2px;
      }
      .order-time {
        font-size: 0.75rem;
        color: var(--text-dim);
      }
      .order-type {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 2px 8px;
        border-radius: 20px;
      }
      .order-type.delivery {
        background: rgba(41, 121, 255, 0.15);
        color: var(--blue);
      }
      .order-type.pickup {
        background: rgba(0, 200, 83, 0.1);
        color: var(--green);
      }
      .order-customer {
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 8px;
      }
      .order-items-list {
        font-size: 0.82rem;
        color: var(--text-dim);
      }
      .order-item-line {
        padding: 3px 0;
        border-bottom: 1px solid var(--border);
      }
      .order-item-line:last-child {
        border-bottom: none;
      }
      .order-item-name {
        color: var(--text);
        font-weight: 500;
      }
      .order-item-detail {
        font-size: 0.75rem;
        color: var(--text-muted);
        padding-left: 8px;
      }
      .order-item-detail.removed {
        color: #ff6b6b;
      }
      .order-item-detail.added {
        color: #69db7c;
      }
      .order-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .btn-order-action {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
      }
      .btn-advance {
        background: var(--green);
        color: #fff;
      }
      .btn-advance:hover {
        background: #00a844;
      }
      .btn-cancel {
        background: var(--surface3);
        color: var(--text-dim);
      }
      .btn-cancel:hover {
        background: var(--red);
        color: #fff;
      }
      .btn-delete {
        background: var(--surface3);
        color: var(--red);
      }
      .btn-delete:hover {
        background: var(--red);
        color: #fff;
      }
      .order-total {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.1rem;
        color: var(--gold);
        margin-top: 8px;
      }
      .no-orders {
        color: var(--text-muted);
        text-align: center;
        padding: 2rem 1rem;
        font-size: 0.85rem;
      }

      /* ══════════════════════════════════════════
     CARDAPIO MANAGER VIEW
  ══════════════════════════════════════════ */
      #view-cardapio {
        display: none;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
      }
      #view-cardapio.active {
        display: flex;
      }
      .cardapio-cats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
      }
      .cat-pill {
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-dim);
        transition: all 0.2s;
        text-transform: uppercase;
      }
      .cat-pill.active {
        background: var(--fire);
        border-color: var(--fire);
        color: #fff;
      }
      .cat-pill:hover:not(.active) {
        border-color: var(--fire);
        color: var(--text);
      }
      .cardapio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
      }
      .menu-item-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.2rem;
        transition: all 0.2s;
      }
      .menu-item-card.unavailable {
        opacity: 0.5;
      }
      .menu-item-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }
      .menu-item-name {
        font-weight: 700;
        font-size: 1rem;
      }
      .menu-item-cat {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 2px;
      }
      .toggle-switch {
        position: relative;
        width: 42px;
        height: 24px;
        flex-shrink: 0;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--surface3);
        border: 1px solid var(--border);
        border-radius: 24px;
        transition: 0.3s;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: var(--text-muted);
        border-radius: 50%;
        transition: 0.3s;
      }
      input:checked + .toggle-slider {
        background: var(--green);
        border-color: var(--green);
      }
      input:checked + .toggle-slider:before {
        transform: translateX(18px);
        background: #fff;
      }
      .menu-item-prices {
        font-size: 0.8rem;
        color: var(--text-dim);
        margin-bottom: 0.75rem;
      }
      .menu-item-prices span {
        color: var(--gold);
        font-weight: 600;
      }
      .menu-subitems {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .subitem-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.82rem;
        padding: 6px 0;
        border-top: 1px solid var(--border);
      }
      .subitem-name {
        color: var(--text-dim);
      }
      .subitem-name.unavailable-text {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      /* ══════════════════════════════════════════
     INSUMOS VIEW
  ══════════════════════════════════════════ */
      #view-insumos {
        display: none;
        flex-direction: column;
        gap: 1.5rem;
        width: 100%;
      }
      #view-insumos.active {
        display: flex;
      }
      .insumos-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
      .insumos-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.2rem;
      }
      .insumos-section-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.1rem;
        letter-spacing: 2px;
        color: var(--text-dim);
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .insumos-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .insumo-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--surface2);
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      .insumo-name {
        font-size: 0.9rem;
        font-weight: 500;
      }
      .insumo-name.unavailable {
        text-decoration: line-through;
        color: var(--text-muted);
      }
      .insumo-price {
        font-size: 0.8rem;
        color: var(--gold);
        font-weight: 600;
      }

      /* ══════════════════════════════════════════
     MODAL
  ══════════════════════════════════════════ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 500;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 2rem;
        width: 520px;
        max-width: 95vw;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-box h2 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.5rem;
        letter-spacing: 3px;
        color: var(--fire);
        margin-bottom: 1.5rem;
      }
      .modal-close {
        float: right;
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 1.4rem;
        cursor: pointer;
        margin-top: -4px;
      }
      .modal-close:hover {
        color: var(--red);
      }
      .detail-section {
        margin-bottom: 1.5rem;
      }
      .detail-section h4 {
        font-size: 0.75rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 0.75rem;
      }
      .detail-kv {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
      }
      .detail-kv:last-child {
        border-bottom: none;
      }
      .detail-kv span:first-child {
        color: var(--text-dim);
      }
      .detail-kv span:last-child {
        font-weight: 600;
      }
      .detail-items-full {
        background: var(--surface2);
        border-radius: 10px;
        padding: 1rem;
      }
      .full-item {
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .full-item:last-child {
        border-bottom: none;
      }
      .full-item-name {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 4px;
      }
      .full-item-sub {
        font-size: 0.8rem;
        color: var(--text-dim);
      }
      .full-item-sub.rem {
        color: #ff8a80;
      }
      .full-item-sub.add {
        color: #b9f6ca;
      }

      /* ══════════════════════════════════════════
     AUDIO / NOTIFICATIONS
  ══════════════════════════════════════════ */
      .notif-badge {
        position: fixed;
        top: 80px;
        right: 20px;
        z-index: 200;
        background: var(--fire);
        color: #fff;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
        font-size: 0.9rem;
        transform: translateX(200%);
        transition: transform 0.3s;
        box-shadow: 0 4px 24px rgba(255, 77, 0, 0.4);
      }
      .notif-badge.show {
        transform: translateX(0);
      }

      /* ══════════════════════════════════════════
     RESPONSIVE
  ══════════════════════════════════════════ */
      @media (max-width: 900px) {
        .orders-columns {
          grid-template-columns: 1fr;
        }
        .insumos-grid {
          grid-template-columns: 1fr;
        }
        .header-brand {
          font-size: 1.2rem;
        }
        .nav-btn span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- LOGIN SCREEN -->
    <div id="login-screen">
      <div class="login-logo">RIBBS ZN 🔥 <span>Kitchen Display</span></div>
      <div class="login-box">
        <h3>Digite o PIN de acesso</h3>
        <div class="pin-display">
          <div class="pin-dot" id="pd0"></div>
          <div class="pin-dot" id="pd1"></div>
          <div class="pin-dot" id="pd2"></div>
          <div class="pin-dot" id="pd3"></div>
          <div class="pin-dot" id="pd4"></div>
          <div class="pin-dot" id="pd5"></div>
        </div>
        <div class="pin-grid">
          <button class="pin-btn" data-digit="1">1</button>
          <button class="pin-btn" data-digit="2">2</button>
          <button class="pin-btn" data-digit="3">3</button>
          <button class="pin-btn" data-digit="4">4</button>
          <button class="pin-btn" data-digit="5">5</button>
          <button class="pin-btn" data-digit="6">6</button>
          <button class="pin-btn" data-digit="7">7</button>
          <button class="pin-btn" data-digit="8">8</button>
          <button class="pin-btn" data-digit="9">9</button>
          <button class="pin-btn clear" data-digit="clear">⌫ Apagar</button>
          <button class="pin-btn" data-digit="0">0</button>
          <button class="pin-btn clear" data-digit="enter">OK</button>
        </div>
        <div class="pin-error" id="pin-error"></div>
      </div>
    </div>

    <!-- HEADER -->
    <header class="kds-header">
      <div class="header-brand">🔥 RIBBS KDS</div>
      <nav class="header-nav">
        <button class="nav-btn active" data-view="orders">📋 Pedidos</button>
        <button class="nav-btn" data-view="cardapio">🍔 Cardápio</button>
        <button class="nav-btn" data-view="insumos">🧂 Insumos</button>
      </nav>
      <div class="header-actions">
        <button class="store-toggle" id="store-toggle">
          <span class="dot"></span>
          <span id="store-label">FECHADO</span>
        </button>
        <button class="btn-logout" onclick="window.logoutKDS()">Sair</button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="kds-main">
      <!-- PEDIDOS VIEW -->
      <div id="view-orders" class="active">
        <div class="orders-columns">
          <div class="orders-col">
            <div class="col-header">
              <span class="col-title pending">⏳ Aguardando</span>
              <span class="col-count" id="count-pending">0</span>
            </div>
            <div id="col-pending"></div>
          </div>
          <div class="orders-col">
            <div class="col-header">
              <span class="col-title making">🔥 Preparando</span>
              <span class="col-count" id="count-making">0</span>
            </div>
            <div id="col-making"></div>
          </div>
          <div class="orders-col">
            <div class="col-header">
              <span class="col-title ready">✅ Pronto</span>
              <span class="col-count" id="count-ready">0</span>
            </div>
            <div id="col-ready"></div>
          </div>
        </div>
      </div>

      <!-- CARDÁPIO VIEW -->
      <div id="view-cardapio">
        <div class="cardapio-cats" id="cardapio-cats"></div>
        <div class="cardapio-grid" id="cardapio-grid"></div>
      </div>

      <!-- INSUMOS VIEW -->
      <div id="view-insumos">
        <div class="insumos-grid">
          <div class="insumos-section">
            <div class="insumos-section-title">💰 Adicionais Pagos</div>
            <div class="insumos-list" id="paid-extras-list"></div>
          </div>
          <div class="insumos-section">
            <div class="insumos-section-title">🥬 Ingredientes Removíveis</div>
            <div class="insumos-list" id="ingredients-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ORDER DETAIL MODAL -->
    <div class="modal-overlay" id="order-modal">
      <div class="modal-box">
        <button class="modal-close" onclick="closeOrderModal()">✕</button>
        <h2 id="modal-order-title">Pedido #000</h2>
        <div id="modal-order-body"></div>
      </div>
    </div>

    <!-- NOTIF BADGE -->
    <div class="notif-badge" id="notif-badge">🔔 Novo pedido!</div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <script>
      // ══════════════════════════════════════════════════════
      // FIREBASE INIT
      // ══════════════════════════════════════════════════════
      const firebaseConfig = {
        apiKey: "AIzaSyDFFbaZmX80QezLfozPAIaIGEhIJm9z43E",
        authDomain: "ribbsznmesas.firebaseapp.com",
        databaseURL: "https://ribbsznmesas-default-rtdb.firebaseio.com",
        projectId: "ribbsznmesas",
        storageBucket: "ribbsznmesas.firebasestorage.app",
        messagingSenderId: "970185571294",
        appId: "1:970185571294:web:25e8552bd72d852283bb4f",
      };

      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.database();

      auth
        .setPersistence(firebase.auth.Auth.Persistence.SESSION)
        .catch(console.error);

      // ══════════════════════════════════════════════════════
      // PIN LOGIN
      // ══════════════════════════════════════════════════════
      let pinBuffer = "";

      function updatePinDisplay() {
        for (let i = 0; i < 6; i++) {
          document
            .getElementById("pd" + i)
            .classList.toggle("filled", i < pinBuffer.length);
        }
      }

      async function submitPin() {
        if (pinBuffer.length < 6) {
          showPinError("PIN deve ter 6 dígitos");
          return;
        }
        try {
          await auth.signInWithEmailAndPassword(
            "rbnacena@gmail.com",
            pinBuffer,
          );
        } catch (e) {
          let msg = "PIN inválido";
          if (e.code === "auth/too-many-requests")
            msg = "Muitas tentativas. Aguarde.";
          if (e.code === "auth/network-request-failed") msg = "Sem conexão";
          showPinError(msg);
          pinBuffer = "";
          updatePinDisplay();
        }
      }

      function showPinError(msg) {
        const el = document.getElementById("pin-error");
        el.textContent = msg;
        setTimeout(() => (el.textContent = ""), 3000);
      }

      document.querySelectorAll(".pin-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const d = btn.dataset.digit;
          if (d === "clear") {
            pinBuffer = pinBuffer.slice(0, -1);
          } else if (d === "enter") {
            submitPin();
            return;
          } else if (pinBuffer.length < 6) {
            pinBuffer += d;
          }
          updatePinDisplay();
          if (pinBuffer.length === 6) setTimeout(submitPin, 200);
        });
      });

      window.addEventListener("keydown", (e) => {
        if (document.getElementById("login-screen").style.display === "none")
          return;
        if (e.key >= "0" && e.key <= "9" && pinBuffer.length < 6) {
          pinBuffer += e.key;
          updatePinDisplay();
          if (pinBuffer.length === 6) setTimeout(submitPin, 200);
        } else if (e.key === "Backspace") {
          pinBuffer = pinBuffer.slice(0, -1);
          updatePinDisplay();
        }
      });

      // ══════════════════════════════════════════════════════
      // AUTH STATE
      // ══════════════════════════════════════════════════════
      auth.onAuthStateChanged((user) => {
        const loginScreen = document.getElementById("login-screen");
        const header = document.querySelector(".kds-header");
        const main = document.querySelector(".kds-main");
        if (user) {
          loginScreen.style.display = "none";
          header.style.display = "flex";
          main.style.display = "flex";
          main.style.flexDirection = "column";
          initKDS();
        } else {
          loginScreen.style.display = "flex";
          header.style.display = "none";
          main.style.display = "none";
          pinBuffer = "";
          updatePinDisplay();
        }
      });

      window.addEventListener("beforeunload", () => auth.signOut());

      window.logoutKDS = async () => {
        await auth.signOut();
        location.reload();
      };

      // ══════════════════════════════════════════════════════
      // NAV
      // ══════════════════════════════════════════════════════
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".nav-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const view = btn.dataset.view;
          document
            .querySelectorAll(".kds-main > div")
            .forEach((v) => v.classList.remove("active"));
          document.getElementById("view-" + view).classList.add("active");
        });
      });

      // ══════════════════════════════════════════════════════
      // STORE TOGGLE
      // ══════════════════════════════════════════════════════
      let storeOpen = false;
      const storeToggle = document.getElementById("store-toggle");
      const storeLabel = document.getElementById("store-label");

      db.ref("lojaAberta").on("value", (snap) => {
        storeOpen = !!snap.val();
        storeToggle.classList.toggle("open", storeOpen);
        storeLabel.textContent = storeOpen ? "ABERTO" : "FECHADO";
      });

      storeToggle.addEventListener("click", () => {
        db.ref("lojaAberta").set(!storeOpen);
      });

      // ══════════════════════════════════════════════════════
      // KDS MAIN
      // ══════════════════════════════════════════════════════
      let cardapioData = {};
      let ordersCache = {};
      let firstLoad = true;

      async function initKDS() {
        await loadCardapio();
        listenOrders();
        loadInsumos();
        renderCardapioView();
      }

      async function loadCardapio() {
        // Try Firebase first, fallback to local JSON
        try {
          const snap = await db.ref("cardapio").once("value");
          if (snap.val()) {
            cardapioData = snap.val();
            return;
          }
        } catch (e) {}
        try {
          const res = await fetch("./cardapio.json");
          cardapioData = await res.json();
        } catch (e) {
          cardapioData = {};
        }
      }

      // ══════════════════════════════════════════════════════
      // ORDERS LISTENER
      // ══════════════════════════════════════════════════════
      function listenOrders() {
        db.ref("pedidos")
          .orderByChild("status")
          .on("value", (snap) => {
            const orders = {};
            snap.forEach((child) => {
              const o = child.val();
              if (["pending", "making", "ready"].includes(o.status)) {
                orders[child.key] = { ...o, id: child.key };
              }
            });

            // Detect new orders
            if (!firstLoad) {
              Object.keys(orders).forEach((k) => {
                if (!ordersCache[k] && orders[k].status === "pending") {
                  showNotif("🔔 Novo pedido chegou!");
                  playBeep();
                }
              });
            }
            firstLoad = false;
            ordersCache = orders;
            renderOrders(orders);
          });
      }

      function renderOrders(orders) {
        const cols = { pending: [], making: [], ready: [] };
        Object.values(orders).forEach((o) => {
          if (cols[o.status]) cols[o.status].push(o);
        });

        // Sort by timestamp
        Object.values(cols).forEach((arr) =>
          arr.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0)),
        );

        document.getElementById("count-pending").textContent =
          cols.pending.length;
        document.getElementById("count-making").textContent =
          cols.making.length;
        document.getElementById("count-ready").textContent = cols.ready.length;

        renderOrderCol("col-pending", cols.pending, "pending");
        renderOrderCol("col-making", cols.making, "making");
        renderOrderCol("col-ready", cols.ready, "ready");
      }

      function renderOrderCol(colId, orders, status) {
        const col = document.getElementById(colId);
        if (orders.length === 0) {
          col.innerHTML = '<div class="no-orders">Nenhum pedido</div>';
          return;
        }
        col.innerHTML = orders.map((o) => orderCardHTML(o, status)).join("");
        col.querySelectorAll("[data-order-id]").forEach((card) => {
          card.addEventListener("click", (e) => {
            if (!e.target.closest(".btn-order-action"))
              openOrderModal(card.dataset.orderId);
          });
        });
        col.querySelectorAll("[data-advance]").forEach((btn) => {
          btn.addEventListener("click", () =>
            advanceOrder(btn.dataset.advance, status),
          );
        });
        col.querySelectorAll("[data-cancel]").forEach((btn) => {
          btn.addEventListener("click", () => cancelOrder(btn.dataset.cancel));
        });
        col.querySelectorAll("[data-delete]").forEach((btn) => {
          btn.addEventListener("click", () => deleteOrder(btn.dataset.delete));
        });
      }

      function orderCardHTML(o, status) {
        const items = o.items || o.carrinho || [];
        const time = o.timestamp ? timeSince(o.timestamp) : "";
        const type = o.tipoEntrega === "delivery" ? "delivery" : "pickup";
        const typeLabel = type === "delivery" ? "🛵 Entrega" : "🏪 Retirada";
        const total = formatBRL(o.total || 0);

        const itemLines = items
          .slice(0, 3)
          .map((item) => {
            const name = item.nome || item.name || "";
            const qty = item.quantidade || item.qty || 1;
            return `<div class="order-item-line"><span class="order-item-name">${qty}x ${name}</span></div>`;
          })
          .join("");
        const more =
          items.length > 3
            ? `<div class="order-item-detail">+ ${items.length - 3} item(s)...</div>`
            : "";

        let actions = "";
        if (status === "pending")
          actions = `<button class="btn-order-action btn-advance" data-advance="${o.id}">🔥 Iniciar</button><button class="btn-order-action btn-cancel" data-cancel="${o.id}">✕ Cancelar</button>`;
        else if (status === "making")
          actions = `<button class="btn-order-action btn-advance" data-advance="${o.id}">✅ Pronto</button><button class="btn-order-action btn-cancel" data-cancel="${o.id}">✕ Cancelar</button>`;
        else if (status === "ready")
          actions = `<button class="btn-order-action btn-advance" data-advance="${o.id}">📦 Entregar</button><button class="btn-order-action btn-delete" data-delete="${o.id}">🗑 Remover</button>`;

        return `
  <div class="order-card ${status}" data-order-id="${o.id}">
    <div class="order-top">
      <span class="order-id">#${o.id.slice(-4).toUpperCase()}</span>
      <span class="order-time">${time}</span>
      <span class="order-type ${type}">${typeLabel}</span>
    </div>
    <div class="order-customer">${o.nomeCliente || o.customerName || "Cliente"}</div>
    <div class="order-items-list">${itemLines}${more}</div>
    <div class="order-total">${total}</div>
    <div class="order-actions">${actions}</div>
  </div>`;
      }

      function advanceOrder(id, currentStatus) {
        const next = { pending: "making", making: "ready", ready: "delivered" };
        const nextStatus = next[currentStatus];
        if (!nextStatus) return;
        if (nextStatus === "delivered") {
          // Move to historico
          const order = ordersCache[id];
          if (order) {
            db.ref("historico/" + id).set({
              ...order,
              status: "delivered",
              deliveredAt: Date.now(),
            });
            db.ref("pedidos/" + id).remove();
          }
        } else {
          db.ref("pedidos/" + id + "/status").set(nextStatus);
        }
      }

      function cancelOrder(id) {
        if (!confirm("Cancelar este pedido?")) return;
        const order = ordersCache[id];
        if (order) {
          db.ref("historico/" + id).set({
            ...order,
            status: "cancelled",
            cancelledAt: Date.now(),
          });
          db.ref("pedidos/" + id).remove();
        }
      }

      function deleteOrder(id) {
        if (!confirm("Remover este pedido do painel?")) return;
        const order = ordersCache[id];
        if (order) {
          db.ref("historico/" + id).set({ ...order, removedAt: Date.now() });
          db.ref("pedidos/" + id).remove();
        }
      }

      // ══════════════════════════════════════════════════════
      // ORDER MODAL
      // ══════════════════════════════════════════════════════
      function openOrderModal(id) {
        const o = ordersCache[id];
        if (!o) return;
        document.getElementById("modal-order-title").textContent =
          `Pedido #${id.slice(-4).toUpperCase()}`;
        const items = o.items || o.carrinho || [];

        const itemsHTML = items
          .map((item) => {
            const name = item.nome || item.name || "";
            const qty = item.quantidade || item.qty || 1;
            const obs = item.observacoes || item.obs || "";
            const removed = item.retirar || item.ingredientesRetirar || [];
            const added = item.adicionais || item.paidExtras || [];

            let removedHTML = "",
              addedHTML = "";
            if (removed.length)
              removedHTML = `<div class="full-item-sub rem">❌ Sem: ${removed.join(", ")}</div>`;
            if (added.length) {
              const addedNames = added
                .map((a) =>
                  typeof a === "string" ? a : a.nome || a.name || "",
                )
                .filter(Boolean);
              if (addedNames.length)
                addedHTML = `<div class="full-item-sub add">➕ Extra: ${addedNames.join(", ")}</div>`;
            }
            const obsHTML = obs
              ? `<div class="full-item-sub">📝 ${obs}</div>`
              : "";
            const price = item.precoTotal || item.preco || 0;

            return `
    <div class="full-item">
      <div class="full-item-name">${qty}x ${name} <span style="color:var(--gold);">${formatBRL(price)}</span></div>
      ${removedHTML}${addedHTML}${obsHTML}
    </div>`;
          })
          .join("");

        const type =
          o.tipoEntrega === "delivery" ? "🛵 Entrega" : "🏪 Retirada";
        const payment = paymentLabel(o.pagamento || o.paymentMethod || "");
        const address =
          o.tipoEntrega === "delivery"
            ? `${o.rua || ""} ${o.numero || ""}, ${o.bairro || ""}`
            : "—";

        document.getElementById("modal-order-body").innerHTML = `
    <div class="detail-section">
      <h4>Cliente</h4>
      <div class="detail-kv"><span>Nome</span><span>${o.nomeCliente || o.customerName || "—"}</span></div>
      <div class="detail-kv"><span>Tipo</span><span>${type}</span></div>
      ${o.tipoEntrega === "delivery" ? `<div class="detail-kv"><span>Endereço</span><span>${address}</span></div>` : ""}
      <div class="detail-kv"><span>Pagamento</span><span>${payment}</span></div>
      ${o.troco ? `<div class="detail-kv"><span>Troco para</span><span>${formatBRL(o.troco)}</span></div>` : ""}
    </div>
    <div class="detail-section">
      <h4>Itens</h4>
      <div class="detail-items-full">${itemsHTML}</div>
    </div>
    <div class="detail-section">
      <div class="detail-kv"><span>Total</span><span style="color:var(--gold);font-size:1.1rem;">${formatBRL(o.total || 0)}</span></div>
    </div>`;

        document.getElementById("order-modal").classList.add("open");
      }

      function closeOrderModal() {
        document.getElementById("order-modal").classList.remove("open");
      }
      document.getElementById("order-modal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("order-modal"))
          closeOrderModal();
      });

      // ══════════════════════════════════════════════════════
      // CARDÁPIO VIEW
      // ══════════════════════════════════════════════════════
      let activeCat = null;
      let menuAvailability = {};
      let subitemsAvailability = {};

      function renderCardapioView() {
        const cats = Object.keys(cardapioData);
        if (cats.length === 0) return;
        if (!activeCat) activeCat = cats[0];

        const catsEl = document.getElementById("cardapio-cats");
        catsEl.innerHTML = cats
          .map(
            (cat) =>
              `<button class="cat-pill ${cat === activeCat ? "active" : ""}" data-cat="${cat}">${cat}</button>`,
          )
          .join("");
        catsEl.querySelectorAll(".cat-pill").forEach((pill) => {
          pill.addEventListener("click", () => {
            activeCat = pill.dataset.cat;
            renderCardapioView();
          });
        });

        // Load availability
        db.ref("menuAvailability").once("value", (snap) => {
          menuAvailability = snap.val() || {};
          db.ref("subitemsAvailability").once("value", (snap2) => {
            subitemsAvailability = snap2.val() || {};
            renderCardapioGrid();
          });
        });
      }

      function renderCardapioGrid() {
        const items = cardapioData[activeCat] || [];
        const grid = document.getElementById("cardapio-grid");
        grid.innerHTML = items
          .map((item) => {
            const key = slugify(item.nome);
            const available = menuAvailability[key] !== false;
            const opcoes = item.opcoes || [];
            const precos = item.precoBase || [];

            const priceStr = precos
              .map(
                (p, i) =>
                  `<span>R$${p}</span>${opcoes[i] ? " (" + opcoes[i] + ")" : ""}`,
              )
              .join(" &bull; ");

            let subitemsHTML = "";
            if (opcoes.length > 1) {
              subitemsHTML =
                `<div class="menu-subitems">` +
                opcoes
                  .map((op, i) => {
                    const subKey = key + "_" + slugify(op);
                    const subAvail = subitemsAvailability[subKey] !== false;
                    return `
        <div class="subitem-row">
          <span class="subitem-name ${!subAvail ? "unavailable-text" : ""}">${op} — R$${precos[i] || 0}</span>
          <label class="toggle-switch">
            <input type="checkbox" ${subAvail ? "checked" : ""} data-subitem="${subKey}">
            <span class="toggle-slider"></span>
          </label>
        </div>`;
                  })
                  .join("") +
                `</div>`;
            }

            return `
    <div class="menu-item-card ${!available ? "unavailable" : ""}">
      <div class="menu-item-top">
        <div>
          <div class="menu-item-name">${item.nome}</div>
          <div class="menu-item-cat">${activeCat}</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" ${available ? "checked" : ""} data-menukey="${key}">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="menu-item-prices">${priceStr}</div>
      ${item.descricao ? `<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;">${item.descricao}</div>` : ""}
      ${subitemsHTML}
    </div>`;
          })
          .join("");

        // Listeners for main toggle
        grid.querySelectorAll("[data-menukey]").forEach((chk) => {
          chk.addEventListener("change", () => {
            menuAvailability[chk.dataset.menukey] = chk.checked;
            db.ref("menuAvailability/" + chk.dataset.menukey).set(chk.checked);
            chk
              .closest(".menu-item-card")
              .classList.toggle("unavailable", !chk.checked);
          });
        });

        // Listeners for sub-option toggles
        grid.querySelectorAll("[data-subitem]").forEach((chk) => {
          chk.addEventListener("change", () => {
            subitemsAvailability[chk.dataset.subitem] = chk.checked;
            db.ref("subitemsAvailability/" + chk.dataset.subitem).set(
              chk.checked,
            );
            chk
              .closest(".subitem-row")
              .querySelector(".subitem-name")
              .classList.toggle("unavailable-text", !chk.checked);
          });
        });
      }

      // ══════════════════════════════════════════════════════
      // INSUMOS
      // ══════════════════════════════════════════════════════
      function loadInsumos() {
        // Collect all unique paid extras and ingredients from cardapio
        const paidExtrasSet = {};
        const ingredientsSet = new Set();

        Object.values(cardapioData).forEach((items) => {
          items.forEach((item) => {
            (item.adicionais || item.paidExtras || []).forEach((a) => {
              const k = slugify(a.nome);
              paidExtrasSet[k] = {
                nome: a.nome,
                preco: a.preco || a.price || 0,
              };
            });
            (
              item.ingredientesPadrao ||
              item.ingredientesPorOpcao?.Simples ||
              []
            ).forEach((i) => ingredientsSet.add(i));
            Object.values(item.ingredientesPorOpcao || {}).forEach((arr) =>
              arr.forEach((i) => ingredientsSet.add(i)),
            );
            (item.simplesIngredients || item.duploIngredients || []).forEach(
              (i) => ingredientsSet.add(i),
            );
          });
        });

        const paidExtras = Object.entries(paidExtrasSet);
        const ingredients = [...ingredientsSet];

        // Load availability states
        Promise.all([
          db.ref("globalPaidExtrasAvailability").once("value"),
          db.ref("globalIngredientsAvailability").once("value"),
        ]).then(([pSnap, iSnap]) => {
          const pAvail = pSnap.val() || {};
          const iAvail = iSnap.val() || {};

          renderInsumosList(
            "paid-extras-list",
            paidExtras.map(([k, v]) => ({
              key: k,
              nome: v.nome,
              price: `R$${v.preco}`,
              available: pAvail[k] !== false,
            })),
            "globalPaidExtrasAvailability",
          );

          renderInsumosList(
            "ingredients-list",
            ingredients.map((nome) => {
              const k = slugify(nome);
              return {
                key: k,
                nome,
                price: null,
                available: iAvail[k] !== false,
              };
            }),
            "globalIngredientsAvailability",
          );
        });
      }

      function renderInsumosList(containerId, items, dbPath) {
        const el = document.getElementById(containerId);
        el.innerHTML = items
          .map(
            (item) => `
  <div class="insumo-row">
    <div>
      <div class="insumo-name ${!item.available ? "unavailable" : ""}" data-key="${item.key}">${item.nome}</div>
      ${item.price ? `<div class="insumo-price">${item.price}</div>` : ""}
    </div>
    <label class="toggle-switch">
      <input type="checkbox" ${item.available ? "checked" : ""} data-ikey="${item.key}" data-dbpath="${dbPath}">
      <span class="toggle-slider"></span>
    </label>
  </div>`,
          )
          .join("");

        el.querySelectorAll("[data-ikey]").forEach((chk) => {
          chk.addEventListener("change", () => {
            db.ref(chk.dataset.dbpath + "/" + chk.dataset.ikey).set(
              chk.checked,
            );
            const nameEl = el.querySelector(`[data-key="${chk.dataset.ikey}"]`);
            if (nameEl) nameEl.classList.toggle("unavailable", !chk.checked);
          });
        });
      }

      // ══════════════════════════════════════════════════════
      // UTILS
      // ══════════════════════════════════════════════════════
      function formatBRL(v) {
        return "R$ " + Number(v).toFixed(2).replace(".", ",");
      }

      function timeSince(ts) {
        const diff = Math.floor((Date.now() - ts) / 1000);
        if (diff < 60) return diff + "s";
        if (diff < 3600) return Math.floor(diff / 60) + "min";
        return Math.floor(diff / 3600) + "h";
      }

      function slugify(str) {
        return (str || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "_");
      }

      function paymentLabel(p) {
        const map = {
          pix: "💚 PIX",
          dinheiro: "💵 Dinheiro",
          debito: "💳 Débito",
          credito: "💳 Crédito",
        };
        return map[p] || p || "—";
      }

      function showNotif(msg) {
        const el = document.getElementById("notif-badge");
        el.textContent = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 4000);
      }

      function playBeep() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
      }
    </script>
  </body>
</html>
